name: CI

on:
  push:
    branches: [main, polish]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Predictive-Maintenance-RAG-Assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Predictive-Maintenance-RAG-Assistant/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pm-rag-assistant ./Predictive-Maintenance-RAG-Assistant